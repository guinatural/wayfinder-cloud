name: Terraform Manual Plan and Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to operate on
        required: true
        type: choice
        options:
          - dev
          - prod
      operation:
        description: Plan only, or apply the plan created in this run
        required: true
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: Required confirmation when operation is apply
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate-input:
    name: Validate manual request
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit apply confirmation
        if: inputs.operation == 'apply' && inputs.confirm_apply != true
        run: |
          echo "::error::Set confirm_apply to true to run an apply."
          exit 1

  terraform:
    name: Terraform ${{ inputs.operation }} (${{ inputs.environment }})
    needs: validate-input
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && (inputs.operation == 'apply' && 'prod-approval' || 'prod') || 'dev' }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.AWS_OIDC_ROLE_ARN_PROD || secrets.AWS_OIDC_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Initialize Terraform
        run: terraform init -reconfigure -backend-config="profile="

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
        working-directory: .

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Create Terraform plan
        run: |
          terraform plan \
            -var="aws_profile=" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -no-color \
            -out=tfplan

      - name: Apply Terraform plan
        if: inputs.operation == 'apply'
        run: terraform apply -auto-approve tfplan
